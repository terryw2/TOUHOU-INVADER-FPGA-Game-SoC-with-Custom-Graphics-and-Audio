<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Urbana EX Host Preview</title>
<style>
  html, body {
    height: 100%;
    margin: 0;
    background: #0a0e17;
    color: #d8f7ff;
    font: 14px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  body {
    display: grid;
    place-items: center;
  }
  main {
    display: grid;
    gap: 12px;
  }
  canvas {
    width: 960px;
    max-width: calc(100vw - 32px);
    image-rendering: pixelated;
    border: 1px solid #1c5364;
    background: #001;
  }
  p {
    margin: 0;
    color: #8bc8d8;
  }
</style>
<main>
  <canvas id="screen" width="640" height="480"></canvas>
  <p>W/S or arrows: select/move, A/D or arrows: change/move, Space/Z: start, X: barrier, Esc: pause, R: reset.</p>
</main>
<script>
const W = 640, H = 480;
const PLAYFIELD_RIGHT = 480, HUD_TEXT_X = 500;
const PLAYER_MIN_X = 16, PLAYER_MAX_X = 456, PLAYER_MIN_Y = 56, PLAYER_MAX_Y = 456;
const PLAYER_START_X = 232, PLAYER_START_Y = 440, PLAYER_FIRE_INTERVAL = 10;
const SHIELD_MAX = 3, STAGE_COUNT = 5;
const NUM_ENEMY_ROWS = 4, NUM_ENEMY_COLS = 7, NUM_ENEMIES = NUM_ENEMY_ROWS * NUM_ENEMY_COLS;
const MAX_PLAYER_BULLETS = 14, MAX_ENEMY_BULLETS = 32, MAX_EXPLOSIONS = 10;
const stageConfig = [
  { name: "NIGHT", fall: 150, dive: 170, fire: 78, bullet: 4 },
  { name: "MIST", fall: 126, dive: 150, fire: 64, bullet: 5 },
  { name: "LUNAR", fall: 104, dive: 132, fire: 52, bullet: 6 },
  { name: "DREAM", fall: 88, dive: 118, fire: 42, bullet: 7 },
  { name: "FINAL", fall: 72, dive: 104, fire: 34, bullet: 8 },
];
const diffConfig = [
  { name: "EASY", speed: 6, shot: 9, period: 125, bulletDelta: -1, shield: 3 },
  { name: "NORMAL", speed: 5, shot: 8, period: 100, bulletDelta: 0, shield: 3 },
  { name: "HARD", speed: 4, shot: 7, period: 75, bulletDelta: 1, shield: 2 },
];
const waveSeed = [
  3, 11, 19, 29, 41, 52, 61, 7, 17, 23, 37, 47, 56, 63,
  5, 13, 31, 43, 53, 57, 62, 2, 29, 34, 46, 58, 60, 64,
];
const keys = new Set(), edges = new Set();
const canvas = document.getElementById("screen");
const ctx = canvas.getContext("2d");
const img = ctx.createImageData(W, H);
let state, player, enemies, playerBullets, enemyBullets, explosions, powerup, boss;
let score, lives, stage, shield, frameTicks, enemyDir, rng, readyTicks, invincibleTicks;
let graze, weaponMode, powerLevel, combo, comboTimer, rapidTicks, barrierTicks, scoreBoostTicks;
let menuCursor, selectedDifficulty, selectedPlayers, selectedEndless, highs, powerupKind;

function resetAll() {
  selectedDifficulty = 1;
  selectedPlayers = 1;
  selectedEndless = 1;
  highs = [0, 0, 0, 0, 0];
  menuCursor = 0;
  resetSession();
  state = "MENU";
}

function diff() { return diffConfig[selectedDifficulty]; }
function stg() { return stageConfig[((Math.max(1, stage) - 1) % STAGE_COUNT)]; }
function pressure() { return Math.min(selectedEndless ? 15 : STAGE_COUNT, Math.max(1, stage)); }
function addScore(v) { score += v * (scoreBoostTicks ? 2 : 1); }
function timedDuration() {
  const base = selectedDifficulty === 0 ? 540 : (selectedDifficulty === 1 ? 420 : 300);
  return Math.max(180, base - pressure() * 8);
}
function powerSprite(kind) {
  if (kind === 0 || kind === 5) return 21;
  if (kind === 1 || kind === 2) return 22;
  if (kind === 4 || kind === 6) return 23;
  return 24;
}
function dropMask() {
  if (selectedDifficulty === 0) return pressure() >= 8 ? 7 : 3;
  if (selectedDifficulty === 2) return pressure() >= 8 ? 31 : 15;
  return pressure() >= 8 ? 15 : 7;
}
function scaled(v) {
  let s = Math.max(12, Math.round(v * diff().period / 100));
  if (selectedEndless && stage > STAGE_COUNT) s = Math.max(12, s - (stage - STAGE_COUNT) * 2);
  return s;
}
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
function rand() { rng = (Math.imul(rng, 1664525) + 1013904223) >>> 0; return rng; }
function wave16(phase) {
  const p = phase & 63;
  if (p < 16) return p;
  if (p < 48) return 32 - p;
  return p - 64;
}

function resetSession() {
  state = "MENU";
  score = 0; lives = selectedPlayers * 3; stage = 1; shield = diff().shield;
  frameTicks = 0; enemyDir = 1; rng = 0x3852026; readyTicks = 0; invincibleTicks = 0;
  graze = 0; weaponMode = 0; powerLevel = 0; combo = 0; comboTimer = 0;
  rapidTicks = 0; barrierTicks = 0; scoreBoostTicks = 0; powerupKind = 0;
  player = { x: PLAYER_START_X, y: PLAYER_START_Y, frame: 0, tint: 0, visible: true };
  playerBullets = Array.from({ length: MAX_PLAYER_BULLETS }, () => ({ visible: false }));
  enemyBullets = Array.from({ length: MAX_ENEMY_BULLETS }, () => ({ visible: false }));
  explosions = Array.from({ length: MAX_EXPLOSIONS }, () => ({ visible: false, ttl: 0, frame: 0, x: 0, y: 0 }));
  powerup = { visible: false, x: 0, y: 0, frame: 0, tint: 0, type: 21 };
  boss = { visible: false, x: 0, y: 0, frame: 0, tint: 0, type: 14, hp: 0, max: 0, kind: 0 };
  spawnEnemies();
}

function spawnEnemies() {
  enemies = [];
  for (let row = 0; row < NUM_ENEMY_ROWS; row++) {
    for (let col = 0; col < NUM_ENEMY_COLS; col++) {
      const homeX = 35 + col * 62, homeY = 54 + row * 38;
      enemies.push({ x: homeX, y: homeY, homeX, homeY, visible: true, type: 10 + (row % 3), frame: 0, tint: row & 3 });
    }
  }
  boss.visible = false;
  if ((stage % 2) === 0 || pressure() >= 5) {
    const kind = pressure() >= 8 ? 2 : (pressure() >= 5 ? 1 : 0);
    Object.assign(boss, { visible: true, kind, x: kind === 2 ? 198 : (kind === 1 ? 214 : 230), y: kind === 2 ? 38 : 46, type: 14 + kind, frame: 0, tint: kind });
    boss.max = 24 + pressure() * 10 + kind * 20;
    boss.hp = boss.max;
  }
}

function startGame() {
  resetSession();
  state = "PLAYING";
  readyTicks = 180;
}

function edge(code) { return edges.has(code); }
function down(code) { return keys.has(code); }
function axisNeg() { return down("KeyA") || down("ArrowLeft"); }
function axisPos() { return down("KeyD") || down("ArrowRight"); }

function updateMenu() {
  frameTicks++;
  if (edge("KeyW") || edge("ArrowUp")) menuCursor = (menuCursor + 2) % 3;
  if (edge("KeyS") || edge("ArrowDown")) menuCursor = (menuCursor + 1) % 3;
  if (menuCursor === 0) {
    if (edge("KeyA") || edge("ArrowLeft")) selectedDifficulty = (selectedDifficulty + 2) % 3;
    if (edge("KeyD") || edge("ArrowRight")) selectedDifficulty = (selectedDifficulty + 1) % 3;
  } else if (menuCursor === 1 && (edge("KeyA") || edge("ArrowLeft") || edge("KeyD") || edge("ArrowRight"))) {
    selectedPlayers = selectedPlayers === 1 ? 2 : 1;
  } else if (menuCursor === 2 && (edge("KeyA") || edge("ArrowLeft") || edge("KeyD") || edge("ArrowRight"))) {
    selectedEndless = selectedEndless ? 0 : 1;
  }
  if (edge("Space") || edge("KeyZ")) startGame();
}

function spawnPlayerBullet(x, y, vx, vy) {
  const b = playerBullets.find(v => !v.visible);
  if (!b) return false;
  Object.assign(b, { x, y, vx, vy, age: 0, visible: true });
  return true;
}

function firePlayer() {
  const shot = diff().shot;
  if ((weaponMode === 1 && powerLevel) || powerLevel >= 2) {
    spawnPlayerBullet(player.x + 10, player.y - 12, -2, 1 - shot);
    spawnPlayerBullet(player.x + 20, player.y - 12, 2, 1 - shot);
  }
  if (powerLevel >= 3) {
    spawnPlayerBullet(player.x + 4, player.y - 4, -3, 2 - shot);
    spawnPlayerBullet(player.x + 26, player.y - 4, 3, 2 - shot);
  }
  spawnPlayerBullet(player.x + 15, player.y - 12, 0, weaponMode === 2 ? -shot - 2 : -shot);
}

function fireEnemy() {
  const live = enemies.filter(e => e.visible);
  if (!live.length) return;
  const b = enemyBullets.find(v => !v.visible);
  if (!b) return;
  const e = live[rand() % live.length];
  const aim = clamp(Math.trunc((player.x - e.x) / 58), -3, 3);
  const speed = clamp(stg().bullet + diff().bulletDelta + (selectedEndless && stage > STAGE_COUNT ? Math.trunc((stage - STAGE_COUNT) / 2) : 0), 2, 10);
  if (((frameTicks >> 4) + enemies.indexOf(e)) % 5 === 0) {
    spawnEnemyShot(e.x + 15, e.y + 30, aim - 2, speed);
    spawnEnemyShot(e.x + 15, e.y + 30, aim, speed + 1);
    spawnEnemyShot(e.x + 15, e.y + 30, aim + 2, speed);
  } else if (pressure() >= 4 && ((((frameTicks >> 5) + enemies.indexOf(e)) & 1) !== 0)) {
    const vx = [0,2,3,2,0,-2,-3,-2], vy = [4,3,1,-1,-2,-1,1,3];
    for (let i=0;i<8;i++) spawnEnemyShot(e.x+15,e.y+30,vx[(i+stage)&7],vy[(i+stage)&7]+boss.kind);
  } else {
    Object.assign(b, { x: e.x + 15, y: e.y + 30, visible: true, vx: aim, vy: speed, age: 0 });
  }
}

function spawnEnemyShot(x, y, vx, vy) {
  const b = enemyBullets.find(v => !v.visible);
  if (!b) return false;
  Object.assign(b, { x, y, vx, vy, age: 0, visible: true });
  return true;
}

function fireBossPattern() {
  if (!boss.visible) return;
  const vx = [0,1,2,3,4,3,2,1,0,-1,-2,-3,-4,-3,-2,-1];
  const vy = [-4,-3,-2,-1,0,1,2,3,4,3,2,1,0,-1,-2,-3];
  if (((frameTicks >> 5) & 1) !== 0) {
    const step = boss.kind === 0 ? 4 : (boss.kind === 1 ? 2 : 1);
    for (let i=0;i<16;i+=step) {
      const p = (i + (frameTicks >> 3)) & 15;
      spawnEnemyShot(boss.x + 30, boss.y + 32, vx[p], vy[p] + 3 + boss.kind);
    }
  } else {
    for (let n=0;n<3+boss.kind*2;n++) {
      const spread = n - (1 + boss.kind);
      spawnEnemyShot(boss.x + 28 + spread*8, boss.y + 56, spread + clamp(Math.trunc((player.x - boss.x) / 96), -2, 2), clamp(stg().bullet + 1 + boss.kind, 3, 11));
    }
  }
}

function overlap(ax, ay, aw, ah, bx, by, bw, bh) {
  return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
}

function spawnExplosion(x, y) {
  const e = explosions.find(v => !v.visible) || explosions[0];
  Object.assign(e, { x, y, visible: true, frame: 0, ttl: 18 });
}

function spawnPowerup(x, y) {
  if (!powerup.visible) {
    let kind = rand() % 8;
    if (selectedDifficulty === 0 && ((rand() & 3) === 0)) kind = rand() & 3;
    else if (selectedDifficulty === 2 && kind < 4 && (rand() & 1)) kind = 4 + (rand() & 3);
    powerupKind = kind;
    Object.assign(powerup, { x, y, visible: true, frame: 0, tint: kind & 3, type: powerSprite(kind) });
  }
}

function updateGame() {
  if (state === "MENU") { updateMenu(); return; }
  if (edge("Escape")) state = state === "PAUSED" ? "PLAYING" : (state === "PLAYING" ? "PAUSED" : state);
  if (edge("KeyR")) { resetSession(); state = "MENU"; return; }
  if (state !== "PLAYING") return;

  frameTicks++;
  player.frame = (frameTicks >> 2) & 15;
  if (comboTimer && --comboTimer === 0) combo = 0;
  if (invincibleTicks) invincibleTicks--;
  if (rapidTicks) rapidTicks--;
  if (barrierTicks) barrierTicks--;
  if (scoreBoostTicks) scoreBoostTicks--;
  const timeStop = (down("KeyX") && (shield || barrierTicks)) || invincibleTicks || barrierTicks;
  if (axisNeg()) player.x -= diff().speed;
  if (axisPos()) player.x += diff().speed;
  if (down("KeyW") || down("ArrowUp")) player.y -= diff().speed;
  if (down("KeyS") || down("ArrowDown")) player.y += diff().speed;
  player.x = clamp(player.x, PLAYER_MIN_X, PLAYER_MAX_X);
  player.y = clamp(player.y, PLAYER_MIN_Y, PLAYER_MAX_Y);
  let fireInterval = rapidTicks ? 5 : PLAYER_FIRE_INTERVAL;
  if (weaponMode === 2 && fireInterval > 6) fireInterval = 6;
  if (frameTicks % fireInterval === 1) firePlayer();
  if (readyTicks) { readyTicks--; return; }

  enemies.forEach((e, i) => {
    if (!e.visible) return;
    const seed = waveSeed[i % waveSeed.length];
    if (frameTicks % scaled(stg().fall) === 0) e.homeY += 10 + pressure() * 2;
    const divePeriod = scaled(stg().dive), phase = (frameTicks + seed * 3) % divePeriod;
    let dive = phase < 42 ? phase * (pressure() + 1) / 2 : 0;
    if (stage >= 3 && phase > divePeriod - 34) dive = (divePeriod - phase) * (pressure() + 1) / 2;
    e.x = clamp(e.homeX + enemyDir * wave16((frameTicks >> 1) + seed) * (7 + pressure()) / 4, 8, PLAYFIELD_RIGHT - 32);
    e.y = e.homeY + dive;
    if ((frameTicks & 7) === 0) e.frame = (e.frame + 1) & 3;
    if (e.y >= player.y - 20) state = "GAME_OVER";
  });
  if (boss.visible) {
    const home = boss.kind === 2 ? 198 : (boss.kind === 1 ? 214 : 230);
    boss.x = clamp(home + wave16((frameTicks >> 1) + stage * 9) * (3 + boss.kind), 8, PLAYFIELD_RIGHT - 70);
    boss.y = 38 + Math.trunc(wave16((frameTicks >> 2) + stage * 7) / 4);
    if ((frameTicks & 7) === 0) boss.frame = (boss.frame + 1) & 15;
  }
  if (frameTicks % 96 === 0) enemyDir = -enemyDir;

  playerBullets.forEach(b => {
    if (!b.visible) return;
    b.x += b.vx; b.y += b.vy; b.age++;
    if (b.y < -16 || b.x < 8 || b.x > PLAYFIELD_RIGHT) b.visible = false;
  });
  if (!timeStop) enemyBullets.forEach(b => {
    if (!b.visible) return;
    b.x += b.vx; b.y += b.vy; b.age++;
    if (b.y > 480 || b.x < 8 || b.x > PLAYFIELD_RIGHT) b.visible = false;
  });
  if (powerup.visible) {
    powerup.y += 2; powerup.frame = (powerup.frame + 1) & 15;
    if (powerup.y > 480) powerup.visible = false;
    if (overlap(powerup.x, powerup.y, 28, 28, player.x + 6, player.y + 6, 20, 20)) {
      powerup.visible = false;
      if (powerupKind === 0) shield = Math.min(SHIELD_MAX, shield + 1);
      else if (powerupKind === 1) weaponMode = (weaponMode + 1) % 3;
      else if (powerupKind === 2) powerLevel = Math.min(3, powerLevel + 1);
      else if (powerupKind === 3) lives = Math.min(9, lives + 1);
      else if (powerupKind === 4) rapidTicks = timedDuration();
      else if (powerupKind === 5) { barrierTicks = timedDuration(); enemyBullets.forEach(v => v.visible = false); }
      else if (powerupKind === 6) scoreBoostTicks = timedDuration();
      else {
        enemyBullets.forEach(v => v.visible = false);
        enemies.forEach(e => { if (e.visible) { e.visible = false; spawnExplosion(e.x, e.y); addScore(20 + pressure() * 4); } });
        if (boss.visible) { boss.hp -= 8 + pressure() * 2; if (boss.hp <= 0) { boss.visible = false; spawnExplosion(boss.x + 20, boss.y + 20); } }
      }
      addScore(100);
    }
  }
  if (frameTicks % scaled(stg().fire) === 0) fireEnemy();
  if (boss.visible && frameTicks % scaled(66 - boss.kind * 10) === 0) fireBossPattern();

  playerBullets.forEach(b => {
    if (!b.visible) return;
    enemies.forEach((e, i) => {
      if (b.visible && e.visible && overlap(b.x, b.y, 4, 12, e.x, e.y, 30, 30)) {
        e.visible = false; b.visible = false;
        const base = 10 + Math.trunc(i / NUM_ENEMY_COLS) * 5;
        combo = comboTimer ? combo + 1 : 1; comboTimer = 90;
        addScore(base * stage + combo * 2); spawnExplosion(e.x, e.y); if ((rand() & dropMask()) === 0) spawnPowerup(e.x, e.y);
      }
    });
    if (b.visible && boss.visible && overlap(b.x, b.y, 4, 12, boss.x, boss.y, 62, 62)) {
      b.visible = false; boss.hp--; combo = comboTimer ? combo + 1 : 1; comboTimer = 90; addScore(5 + combo);
      if (boss.hp <= 0) { boss.visible = false; spawnExplosion(boss.x + 20, boss.y + 20); spawnPowerup(boss.x + 24, boss.y + 32); addScore(500 + pressure() * 100 + boss.kind * 250); }
    }
  });
  enemyBullets.forEach(b => {
    if (!b.visible || !overlap(b.x, b.y, 4, 12, player.x + 8, player.y + 8, 16, 16)) return;
    b.visible = false;
    if (barrierTicks) { addScore(5); return; }
    if (invincibleTicks) return;
    if (shield) { shield--; enemyBullets.forEach(v => v.visible = false); }
    else lives--;
    invincibleTicks = 72; spawnExplosion(player.x, player.y);
    if (lives <= 0) state = "GAME_OVER";
  });
  explosions.forEach(e => { if (e.visible) { if (e.ttl-- <= 0) e.visible = false; else if ((frameTicks & 3) === 0) e.frame++; } });
  if (!boss.visible && enemies.every(e => !e.visible)) {
    stage++;
    if (stage > STAGE_COUNT && !selectedEndless) state = "WIN";
    else { shield = Math.min(SHIELD_MAX, shield + 1); readyTicks = 150; combo = 0; comboTimer = 0; spawnEnemies(); }
  }
}

function rgb12(v) { return [((v >> 8) & 15) * 17, ((v >> 4) & 15) * 17, (v & 15) * 17]; }
function palette(id, tint = 0) {
  const map = [0x000,0x0CF,0x0F4,0xF43,0xFC0,0xF0F,0xFFF,0x55F,0xF8A,0x8FF,0x8F8,0xF88,0xAA0,0x0AA,0xA0A,0xFFF];
  let [r,g,b] = rgb12(map[id] ?? 0xDDD);
  if (tint === 1) { g >>= 1; b >>= 1; }
  if (tint === 2) { r >>= 1; b >>= 1; }
  if (tint === 3) { r >>= 1; g >>= 1; }
  if (tint === 4) { r = Math.min(255, r | 0x33); g = Math.min(255, g | 0x33); b = Math.min(255, b | 0x33); }
  return [r,g,b,255];
}
function setPx(x, y, c) { if (x < 0 || x >= W || y < 0 || y >= H) return; const p = (y * W + x) * 4; img.data[p]=c[0]; img.data[p+1]=c[1]; img.data[p+2]=c[2]; img.data[p+3]=255; }
function bg(x, y) {
  const sy = y + (frameTicks & 255);
  let h = (x & 1023) ^ (((sy & 255) << 2) & 1023) ^ (((x & 31) << 5) | (sy & 31));
  const moonDx = Math.abs(x - 398), moonDy = Math.abs(y - 82), moonMetric = moonDx + moonDy * 2;
  const nebula = ((x & 1023) + ((sy & 255) << 2)) ^ (((x & 31) << 5) | ((sy >> 2) & 31));
  const aurora = ((x >> 3) + (sy >> 3) + (frameTicks >> 2)) & 63;
  let c = x >= 488 ? 0x013 : ((y & 1) ? 0x001 : 0x002);
  if (x >= 488) {
    if (x === 488 || x === 489) c = 0x8FF;
    else if (x === 632 || x === 633) c = 0xF8A;
    else if ((y & 63) <= 1) c = 0x045;
    else if ((x & 31) === 0 && (y & 4)) c = 0x024;
  } else {
    if (((nebula >> 5) & 15) === 3) c = 0x104;
    else if ((nebula >> 6) === 11) c = 0x024;
    else if (((nebula >> 4) & 15) === 7 && (frameTicks & 16)) c = 0x112;
    if ((aurora >> 1) === 0x08 || (aurora >> 1) === 0x19) c = 0x205;
    else if ((aurora >> 2) === 0x3 && (h & 3) !== 0) c = 0x038;
    if (x >= 330 && x <= 466 && y >= 24 && y <= 142 && moonMetric < 78) {
      c = moonMetric > 68 ? 0xF8A : 0x345;
      if ((h & 63) === 0x12 || (((moonDx >> 2) & 15) === ((moonDy >> 2) & 15) && (h & 4))) c = 0x234;
    }
    if (y >= 342) {
      if ((y & 31) === 0 || (y & 63) === 48) c = 0x08A;
      if (((x + (y << 2) + (frameTicks & 127)) & 63) <= 1 || ((x - (y << 1) + (frameTicks & 63)) & 63) <= 1) c = 0x315;
    }
    if (h === 0x155) c = 0xAAF;
    else if ((h >> 3) === 0x36) c = 0x77F;
    else if ((h >> 2) === 0x6D) c = 0x55A;
    if ((x & 127) === ((frameTicks & 127) ^ (y & 127)) && (h & 7) === 5) c = 0xF8A;
  }
  return [...rgb12(c), 255];
}
function spr(type, frame, row, col) {
  let body = false;
  if (type === 0) {

    if (row>=2&&row<=5&&col>=7-(row&3)&&col<=8+(row&3)) return row===2?6:3;
    if ((row>=5&&row<=8&&col>=3&&col<=12)||(row===9&&col>=1&&col<=14)) return (row===5||col===3||col===12)?6:4;
    if (row>=10&&row<=12&&col>=0&&col<=15) return (col<=2||col>=13)?3:4;
    if (row===13&&col>=4&&col<=11) return 3;
    if (row>=14&&col>=6&&col<=9) return (frame&1)?4:8;
    return 0;
  }
  if (type===1) {
    if ((col<=4&&row>=3&&row<=10&&col+row>=6&&row>=col)||(col>=11&&row>=5&&row<=13&&col+row<=24)) return 6;
    if (row>=5&&row<=11&&col>=5&&col<=10) return (row>=7&&row<=10&&col>=6&&col<=9)?3:6;
    if ((frame&1)&&row===12&&col>=6&&col<=9) return 4;

  }
  if (type===2) {
    const ringA=row>=2&&row<=13&&col>=4&&col<=11&&(row===2||row===13||col===4||col===11);
    const ringB=row>=4&&row<=11&&col>=2&&col<=13&&(row===4||row===11||col===2||col===13);
    if (ringA||ringB) return 6;
    if (row>=5&&row<=10&&col>=5&&col<=10) return (row>=7&&row<=8&&col>=7&&col<=8)?6:3;
    if ((frame&1)&&(row===1||row===14)&&col>=7&&col<=8) return 4;
    return 0;
  }
  if (type===3) {
    body=(row>=4&&row<=11&&col>=3&&col<=12)||(row>=6&&row<=9&&col>=1&&col<=14);
    if ((row===7||row===8)&&col>=7&&col<=8) return 6;
    return body?(((row===6||row===9)&&col>=6&&col<=9)?8:5):0;
